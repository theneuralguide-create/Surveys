<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2563eb">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Network</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/crm-180.png">

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<body class="crm">

<div id="topbar"></div>
<main id="main"></main>
<nav id="tabbar" class="tabbar" hidden>
  <a href="#today" data-tab="today"><span class="ico">☀︎</span><span>Today</span></a>
  <a href="#log" data-tab="log" class="log"><span class="ico">+</span><span>Log</span></a>
  <a href="#people" data-tab="people"><span class="ico">☺</span><span>People</span></a>
</nav>
<div id="toast" class="toast"></div>
<div id="overlay"></div>

<script>
/* =================== backend =================== */
/* One endpoint: api/crm.js on Vercel. It forwards { fn, args } to the
   matching Postgres function. Nothing else is reachable from the page. */
var API = 'api/crm';
var TOK_KEY = 'crm-tok', DRAFT_KEY = 'crm-draft';

function rpc(fn, args){
  return fetch(API, { method:'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fn: fn, args: args || {} }) })
    .then(function(r){
      var ct = r.headers.get('content-type') || '';
      if (ct.indexOf('json') === -1){
        throw new Error(r.status === 404 ? 'The API is not running here — open the app on its Vercel URL.' : 'request failed (' + r.status + ')');
      }
      return r.json().then(function(j){
        if (!r.ok) throw new Error((j && j.message) || ('request failed (' + r.status + ')'));
        return j;
      });
    });
}
/* Every data call goes through here so an expired session bounces to login once. */
function call(fn, args){
  var a = { tok: state.tok };
  Object.keys(args || {}).forEach(function(k){ a[k] = args[k]; });
  return rpc(fn, a).catch(function(e){
    if (String(e.message).indexOf('not signed in') !== -1){ signOut('Your session expired — sign in again.'); }
    throw e;
  });
}

/* =================== state =================== */
var state = {
  tok: localStorage.getItem(TOK_KEY) || null,
  route: { view: 'today' },
  dash: null,
  people: [],          /* last loaded People list */
  peopleQ: '',
  chip: 'all',
  contact: null,       /* currently open contact (with interactions) */
  busy: false
};
var main = document.getElementById('main');
var topbar = document.getElementById('topbar');
var tabbar = document.getElementById('tabbar');

/* =================== helpers =================== */
function escHtml(s){ return String(s === null || s === undefined ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function attr(s){ return escHtml(s).replace(/'/g, '&#39;'); }
function todayISO(){ var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function pad(n){ return (n < 10 ? '0' : '') + n; }
function addDaysISO(n){ var d = new Date(); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function parseISO(s){ if (!s) return null; var p = String(s).slice(0,10).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(s){ var d = parseISO(s); if (!d) return '—'; return d.getDate() + ' ' + MONTHS[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''); }
function daysFromToday(s){ var d = parseISO(s); if (!d) return null; var t = parseISO(todayISO()); return Math.round((d - t) / 86400000); }
function relDate(s){
  var n = daysFromToday(s);
  if (n === null) return 'never';
  if (n === 0) return 'today';
  if (n === 1) return 'tomorrow';
  if (n === -1) return 'yesterday';
  if (n < 0) return (-n) + ' days ago';
  return 'in ' + n + ' days';
}
function initials(name){
  var p = String(name || '').trim().split(/\s+/);
  return ((p[0] || '').charAt(0) + (p.length > 1 ? p[p.length-1].charAt(0) : '')).toUpperCase() || '?';
}
function warmthDots(w){
  var h = '<span class="warmth" title="Warmth ' + w + '/5">';
  for (var i = 1; i <= 5; i++) h += '<i class="' + (i <= w ? 'on' : '') + '"></i>';
  return h + '</span>';
}
function roleLine(c){
  var parts = [];
  if (c.job_title) parts.push(c.job_title);
  if (c.company) parts.push(c.company);
  return parts.join(' · ');
}
function cadenceLabel(d){
  d = +d || 0;
  if (!d) return 'No cadence';
  if (d === 7) return 'Weekly'; if (d === 14) return 'Every 2 weeks'; if (d === 30) return 'Monthly';
  if (d === 60) return 'Every 2 months'; if (d === 90) return 'Quarterly'; if (d === 180) return 'Twice a year'; if (d === 365) return 'Yearly';
  return 'Every ' + d + ' days';
}
var toastTimer;
function toast(msg, isErr){
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.className = 'toast'; }, isErr ? 3600 : 2000);
}
function go(hash){ location.hash = hash; }
function v(id){ var el = document.getElementById(id); return el ? el.value.trim() : ''; }

/* =================== router =================== */
function parseHash(){
  var h = (location.hash || '#today').slice(1).split('/');
  var view = h[0] || 'today';
  if (view === 'c')    return { view: 'contact', id: h[1] };
  if (view === 'edit') return { view: 'contactForm', id: h[1] };
  if (view === 'new')  return { view: 'contactForm' };
  if (view === 'log')  return { view: 'logForm', cid: h[1] };
  if (view === 'i')    return { view: 'logForm', cid: h[1], iid: h[2] };
  if (view === 'people') return { view: 'people' };
  return { view: 'today' };
}
function route(){
  state.route = parseHash();
  closeSheet();
  if (!state.tok){ renderLogin(); return; }
  document.body.classList.remove('gated');
  tabbar.hidden = false;
  var tab = { today:'today', people:'people', contact:'people', contactForm:'people', logForm:'log' }[state.route.view];
  Array.prototype.forEach.call(tabbar.querySelectorAll('a'), function(a){ a.classList.toggle('active', a.getAttribute('data-tab') === tab); });
  window.scrollTo(0, 0);
  var r = state.route;
  if (r.view === 'today') loadToday();
  else if (r.view === 'people') renderPeople();
  else if (r.view === 'contact') loadContact(r.id);
  else if (r.view === 'contactForm') openContactForm(r.id);
  else if (r.view === 'logForm') openLogForm(r.cid, r.iid);
}
window.addEventListener('hashchange', route);

function setTop(title, sub, left, right){
  topbar.innerHTML =
    '<div class="topbar">' +
      (left || '') +
      '<div style="flex:1; min-width:0;">' +
        (sub ? '<div class="tb-sub">' + escHtml(sub) + '</div>' : '') +
        '<div class="tb-title">' + escHtml(title) + '</div>' +
      '</div>' +
      (right || '') +
    '</div>';
}
function backBtn(hash, label){ return '<button class="tb-btn back" onclick="go(\'' + attr(hash) + '\')">‹ ' + escHtml(label || 'Back') + '</button>'; }

/* =================== gates =================== */
function renderLogin(msg){
  tabbar.hidden = true; topbar.innerHTML = '';
  document.body.classList.add('gated');
  main.innerHTML =
    '<div class="gate-wrap"><div class="gate">' +
      '<div class="panel">' +
        '<div class="press"></div>' +
        '<h1>Network</h1>' +
        '<p>Your people, your conversations, your follow-ups.</p>' +
        '<div class="field"><input type="password" id="pw-input" placeholder="Password" autocomplete="current-password" enterkeyhint="go"></div>' +
        (msg ? '<div class="form-error">' + escHtml(msg) + '</div>' : '') +
        '<button class="btn-primary" style="width:100%; padding:14px;" onclick="tryLogin()">Unlock</button>' +
      '</div>' +
    '</div></div>';
  var inp = document.getElementById('pw-input');
  inp.focus();
  inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') tryLogin(); });
}
function tryLogin(){
  var pw = document.getElementById('pw-input').value;
  if (!pw) return;
  rpc('crm_login', { pw: pw }).then(function(tok){
    if (tok){
      state.tok = tok;
      localStorage.setItem(TOK_KEY, tok);
      route();
    } else {
      renderLogin('Incorrect password.');
    }
  }).catch(function(e){ renderLogin(e.message); });
}
function signOut(msg){
  var tok = state.tok;
  state.tok = null; state.dash = null; state.people = []; state.contact = null;
  localStorage.removeItem(TOK_KEY);
  if (tok) rpc('crm_logout', { tok: tok }).catch(function(){});
  renderLogin(msg);
}

/* =================== TODAY =================== */
function loadToday(){
  setTop('Today', fmtDate(todayISO()), '', '<button class="tb-btn" onclick="openMenu()" aria-label="Menu">⋯</button>');
  if (!state.dash) main.innerHTML = '<div class="empty" style="margin-top:20px;">Loading…</div>';
  else renderToday();
  call('crm_dashboard').then(function(d){ state.dash = d; if (state.route.view === 'today') renderToday(); })
    .catch(function(e){ if (state.tok) main.innerHTML = '<div class="notice"><b>Could not load:</b> ' + escHtml(e.message) + '</div>'; });
}
function statBox(num, lbl, cls, hash){
  return '<div class="stat-box ' + (num && cls ? cls : '') + '" onclick="go(\'' + hash + '\')"><div class="num">' + num + '</div><div class="lbl">' + lbl + '</div></div>';
}
function stepRow(s, badgeCls){
  var n = daysFromToday(s.next_step_due);
  var when = s.next_step_due ? relDate(s.next_step_due) : 'no date';
  return '<div class="row">' +
    '<button class="chk" title="Mark done" onclick="completeStep(\'' + attr(s.id) + '\', this)">✓</button>' +
    '<a class="body" href="#c/' + attr(s.contact_id) + '" style="text-decoration:none; color:inherit;">' +
      '<div class="name">' + escHtml(s.full_name) + (s.company ? ' <span style="font-weight:400; color:var(--text-muted);">· ' + escHtml(s.company) + '</span>' : '') + '</div>' +
      '<div class="task">' + escHtml(s.my_next_step) + '</div>' +
    '</a>' +
    '<div class="side"><span class="badge ' + badgeCls + '">' + escHtml(when) + '</span>' +
      (s.next_step_due ? '<span>' + escHtml(fmtDate(s.next_step_due)) + '</span>' : '<span>from ' + escHtml(fmtDate(s.happened_on)) + '</span>') + '</div>' +
  '</div>';
}
function personRow(c, sideHtml){
  return '<a class="row" href="#c/' + attr(c.id) + '">' +
    '<div class="av w' + (c.warmth || 3) + '">' + escHtml(initials(c.full_name)) + '</div>' +
    '<div class="body"><div class="name">' + escHtml(c.full_name) + '</div>' +
      '<div class="meta">' + escHtml(roleLine(c) || c.work_area || '') + '</div></div>' +
    '<div class="side">' + (sideHtml || '') + '</div>' +
  '</a>';
}
function section(title, count, bodyHtml, linkHtml){
  return '<div class="sec"><div class="sec-head"><div class="sec-title">' + title + (count !== null && count !== undefined ? ' <b>' + count + '</b>' : '') + '</div>' + (linkHtml || '') + '</div>' + bodyHtml + '</div>';
}
function renderToday(){
  var d = state.dash, s = d.stats;
  var h = '<div class="stat-grid crm">' +
    statBox(s.overdue, 'Overdue', 'alert', '#today') +
    statBox(s.due_soon, 'Due this week', '', '#today') +
    statBox(s.cold, 'Going cold', 'chill', '#people') +
    statBox(s.open_problems, 'Open problems', '', '#people') +
    statBox(s.contacts, 'People', '', '#people') +
    statBox(s.conversations, 'Conversations', '', '#people') +
  '</div>';

  if (!s.contacts){
    h += '<div class="sec"><div class="card hl"><div class="card-label">Start here</div><div class="card-body">Your network is empty. Tap <b>Log</b> after your next conversation — it takes about a minute and creates the person as you go.</div>' +
      '<div class="btn-row" style="margin-top:12px;"><button class="btn-primary" onclick="go(\'#log\')">Log a conversation</button><button class="btn-ghost" onclick="go(\'#new\')">Add a person</button></div></div></div>';
  }

  if (d.overdue.length) h += section('Overdue', d.overdue.length, '<div class="rows">' + d.overdue.map(function(x){ return stepRow(x, 'over'); }).join('') + '</div>');
  if (d.due_soon.length) h += section('Due this week', d.due_soon.length, '<div class="rows">' + d.due_soon.map(function(x){ return stepRow(x, 'due'); }).join('') + '</div>');
  if (!d.overdue.length && !d.due_soon.length && s.contacts) h += section('Follow-ups', null, '<div class="empty">Nothing due. Set a next step when you log a conversation and it will show up here.</div>');

  if (d.cold.length) h += section('Going cold', d.cold.length, '<div class="rows">' + d.cold.map(function(c){
    return personRow(c, '<span class="badge cold">' + (c.last_spoke_on ? escHtml(relDate(c.last_spoke_on)) : 'never spoken') + '</span><span>' + escHtml(cadenceLabel(c.cadence_days)) + '</span>');
  }).join('') + '</div>');

  if (d.problems.length) h += section('Problems I could solve', d.problems.length, d.problems.map(function(c){
    return '<a class="card warn" href="#c/' + attr(c.id) + '" style="display:block; text-decoration:none; color:inherit;"><div class="card-label">' + escHtml(c.full_name) + (c.company ? ' · ' + escHtml(c.company) : '') + '</div><div class="card-body">' + escHtml(c.key_problem) + '</div></a>';
  }).join(''));

  if (d.undated.length) h += section('Next steps without a date', d.undated.length, '<div class="rows">' + d.undated.map(function(x){ return stepRow(x, ''); }).join('') + '</div>');

  if (d.recent.length) h += section('Recent conversations', null, '<div class="rows">' + d.recent.map(function(r){
    return '<a class="row" href="#c/' + attr(r.contact_id) + '"><div class="body"><div class="name">' + escHtml(r.full_name) + '</div>' +
      '<div class="meta">' + escHtml((r.takeaways || r.summary || '').split('\n')[0] || (r.channel || 'Conversation')) + '</div></div>' +
      '<div class="side"><span>' + escHtml(fmtDate(r.happened_on)) + '</span>' + (r.channel ? '<span>' + escHtml(r.channel) + '</span>' : '') + '</div></a>';
  }).join('') + '</div>');

  main.innerHTML = h;
}
function completeStep(id, btn){
  if (btn) btn.classList.add('done');
  call('crm_complete_step', { p_id: id, p_done: true }).then(function(){
    toast('Done ✓');
    state.dash = null;
    if (state.route.view === 'today') loadToday();
    else if (state.route.view === 'contact' && state.contact) loadContact(state.contact.id);
  }).catch(function(e){ toast(e.message, true); });
}

/* =================== menu / export =================== */
function openMenu(){
  document.getElementById('overlay').innerHTML =
    '<div class="sheet-bg" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="handle"></div>' +
      '<button onclick="go(\'#new\'); closeSheet();">Add a person</button>' +
      '<button onclick="exportCSV(\'contacts\')">Export people (CSV)</button>' +
      '<button onclick="exportCSV(\'interactions\')">Export conversations (CSV)</button>' +
      '<button onclick="exportJSON()">Full backup (JSON)</button>' +
      '<button onclick="state.dash=null; closeSheet(); loadToday();">Refresh</button>' +
      '<button class="danger" onclick="closeSheet(); signOut();">Sign out</button>' +
    '</div></div>';
}
function closeSheet(){ document.getElementById('overlay').innerHTML = ''; }
function csvOf(rows, cols){
  var q = function(x){ if (x === null || x === undefined) return ''; if (Array.isArray(x)) x = x.join('; '); x = String(x); return /[",\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; };
  return cols.join(',') + '\n' + rows.map(function(r){ return cols.map(function(c){ return q(r[c]); }).join(','); }).join('\n');
}
function deliverFile(name, text, mime){
  var blob = new Blob([text], { type: mime });
  try {
    var file = new File([blob], name, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [file] })){
      navigator.share({ files: [file], title: name }).catch(function(){});
      return;
    }
  } catch(e){}
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function exportCSV(which){
  closeSheet();
  call('crm_export').then(function(x){
    var stamp = todayISO();
    if (which === 'contacts'){
      var cols = ['full_name','company','job_title','work_area','seniority','industry','email','phone','linkedin','other_link','location','how_we_met','introduced_by','tags','warmth','cadence_days','key_problem','problem_status','their_ask','my_ask','personal_notes','notes','archived','created_at','id'];
      deliverFile('network-people-' + stamp + '.csv', csvOf(x.contacts, cols), 'text/csv');
    } else {
      var names = {}; x.contacts.forEach(function(c){ names[c.id] = c.full_name; });
      var rows = x.interactions.map(function(i){ i.contact_name = names[i.contact_id] || ''; return i; });
      var cols2 = ['contact_name','happened_on','channel','context','summary','takeaways','their_cta','problem_spotted','my_next_step','next_step_due','next_step_done','contact_id','id'];
      deliverFile('network-conversations-' + stamp + '.csv', csvOf(rows, cols2), 'text/csv');
    }
  }).catch(function(e){ toast(e.message, true); });
}
function exportJSON(){
  closeSheet();
  call('crm_export').then(function(x){
    deliverFile('network-backup-' + todayISO() + '.json', JSON.stringify(x, null, 2), 'application/json');
  }).catch(function(e){ toast(e.message, true); });
}

/* =================== PEOPLE =================== */
var searchTimer;
function renderPeople(){
  setTop('People', null, '', '<button class="tb-btn" onclick="go(\'#new\')">+ Add</button>');
  main.innerHTML =
    '<div class="search"><input type="search" id="q" placeholder="Search names, companies, notes, conversations…" value="' + attr(state.peopleQ) + '" autocomplete="off">' +
      (state.peopleQ ? '<button class="clr" onclick="state.peopleQ=\'\'; renderPeople();">✕</button>' : '') + '</div>' +
    '<div class="chips" id="chips"></div>' +
    '<div id="people-list" style="margin-top:8px;">' + (state.people.length ? '' : '<div class="empty">Loading…</div>') + '</div>';
  var q = document.getElementById('q');
  q.addEventListener('input', function(){
    state.peopleQ = q.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(loadPeople, 220);
  });
  if (state.people.length) renderPeopleList();
  loadPeople();
}
function loadPeople(){
  var qAtCall = state.peopleQ;
  call('crm_list_contacts', { q: qAtCall || null, tag: null }).then(function(list){
    if (state.route.view !== 'people' || qAtCall !== state.peopleQ) return;
    state.people = list || [];
    renderPeopleList();
  }).catch(function(e){ toast(e.message, true); });
}
function setChip(c){ state.chip = c; renderPeopleList(); }
function renderPeopleList(){
  var box = document.getElementById('people-list'), chips = document.getElementById('chips');
  if (!box) return;
  var all = state.people;
  var tags = {}; all.forEach(function(c){ (c.tags || []).forEach(function(t){ tags[t] = (tags[t] || 0) + 1; }); });
  var chipBtn = function(key, label){ return '<button class="chip' + (state.chip === key ? ' active' : '') + '" onclick="setChip(\'' + attr(key) + '\')">' + escHtml(label) + '</button>'; };
  var ch = chipBtn('all', 'All ' + all.length) + chipBtn('cold', 'Going cold') + chipBtn('problem', 'Open problem') + chipBtn('warm', 'Warm') + chipBtn('recent', 'Recently added');
  Object.keys(tags).sort().forEach(function(t){ ch += chipBtn('tag:' + t, '#' + t + ' ' + tags[t]); });
  chips.innerHTML = ch;

  var list = all.filter(function(c){
    var k = state.chip;
    if (k === 'all') return true;
    if (k === 'cold') return c.is_cold;
    if (k === 'problem') return c.problem_status === 'open' && c.key_problem;
    if (k === 'warm') return c.warmth >= 4;
    if (k === 'recent') return (Date.now() - new Date(c.created_at).getTime()) < 14 * 86400000;
    if (k.indexOf('tag:') === 0) return (c.tags || []).indexOf(k.slice(4)) !== -1;
    return true;
  });
  if (state.chip === 'recent') list = list.slice().sort(function(a, b){ return a.created_at < b.created_at ? 1 : -1; });

  if (!list.length){
    box.innerHTML = '<div class="empty">' + (all.length ? 'No one matches.' : (state.peopleQ ? 'No matches for “' + escHtml(state.peopleQ) + '”.' : 'No people yet. Tap <b>+ Add</b>, or log a conversation.')) + '</div>';
    return;
  }
  box.innerHTML = '<div class="rows">' + list.map(function(c){
    var side = '<span>' + (c.last_spoke_on ? escHtml(relDate(c.last_spoke_on)) : 'never spoken') + '</span>';
    if (c.is_cold) side = '<span class="badge cold">cold</span>' + side;
    else if (c.problem_status === 'open' && c.key_problem) side = '<span class="badge open">problem</span>' + side;
    return personRow(c, side);
  }).join('') + '</div>';
}

/* =================== CONTACT DETAIL =================== */
function loadContact(id){
  setTop('', null, backBtn('#people', 'People'), '');
  if (!(state.contact && state.contact.id === id)) main.innerHTML = '<div class="empty" style="margin-top:20px;">Loading…</div>';
  else renderContact();
  call('crm_get_contact', { p_id: id }).then(function(c){
    state.contact = c;
    if (state.route.view === 'contact' && state.route.id === id) renderContact();
  }).catch(function(e){ main.innerHTML = '<div class="notice"><b>Could not load:</b> ' + escHtml(e.message) + '</div>'; });
}
function card(label, body, cls){
  if (!body) return '';
  return '<div class="card ' + (cls || '') + '"><div class="card-label">' + label + '</div><div class="card-body">' + escHtml(body) + '</div></div>';
}
function linkHref(u){ u = String(u || '').trim(); if (!u) return ''; return /^https?:\/\//i.test(u) ? u : 'https://' + u; }
function renderContact(){
  var c = state.contact;
  setTop(c.full_name, null, backBtn('#people', 'People'), '<button class="tb-btn" onclick="go(\'#edit/' + attr(c.id) + '\')">Edit</button>');
  var isCold = c.cadence_days > 0 && (!c.last_spoke_on || daysFromToday(c.last_spoke_on) < -c.cadence_days);

  var facts = [];
  facts.push(c.times_spoken + ' conversation' + (c.times_spoken === 1 ? '' : 's'));
  facts.push(c.last_spoke_on ? 'last ' + relDate(c.last_spoke_on) : 'never logged');
  if (c.cadence_days) facts.push(cadenceLabel(c.cadence_days).toLowerCase());
  if (c.location) facts.push(c.location);

  var h = '<div class="profile">' +
    '<h1>' + escHtml(c.full_name) + '</h1>' +
    (roleLine(c) ? '<div class="role"><b>' + escHtml(c.job_title || '') + '</b>' + (c.job_title && c.company ? ' at ' : '') + escHtml(c.company || '') + '</div>' : '') +
    (c.work_area || c.industry || c.seniority ? '<div class="area">' + escHtml([c.work_area, c.seniority, c.industry].filter(Boolean).join(' · ')) + '</div>' : '') +
    '<div class="facts">' + warmthDots(c.warmth) + facts.map(function(f){ return '<span>' + escHtml(f) + '</span>'; }).join('') +
      (isCold ? '<span class="badge cold">going cold</span>' : '') + '</div>' +
    (c.tags && c.tags.length ? '<div style="margin-top:10px;">' + c.tags.map(function(t){ return '<span class="tag">#' + escHtml(t) + '</span>'; }).join('') + '</div>' : '') +
  '</div>';

  h += '<div class="actions">' +
    '<a class="' + (c.phone ? '' : 'off') + '" href="' + (c.phone ? 'tel:' + attr(c.phone) : '#') + '"><span class="ico">☏</span>Call</a>' +
    '<a class="' + (c.email ? '' : 'off') + '" href="' + (c.email ? 'mailto:' + attr(c.email) : '#') + '"><span class="ico">✉︎</span>Email</a>' +
    '<a class="' + (c.linkedin ? '' : 'off') + '" href="' + attr(linkHref(c.linkedin) || '#') + '" target="_blank" rel="noopener"><span class="ico">in</span>LinkedIn</a>' +
    '<a href="#log/' + attr(c.id) + '"><span class="ico">+</span>Log</a>' +
  '</div>';

  h += '<div class="sec two-col"><div>';
  h += '<div class="card ' + (c.key_problem ? 'warn' : '') + '"><div class="card-label">Problem I might solve ' +
      (c.key_problem ? '<span class="badge ' + attr(c.problem_status) + '" style="margin-left:6px;">' + escHtml(c.problem_status) + '</span>' : '') + '</div>' +
      '<div class="card-body' + (c.key_problem ? '' : ' muted') + '">' + (c.key_problem ? escHtml(c.key_problem) : 'Nothing spotted yet. Log a conversation and note the problem you could help with.') + '</div></div>';
  if (c.their_ask || c.my_ask){
    h += '<div class="kv" style="margin-top:8px;">' +
      '<div class="card"><div class="card-label">They want from me</div><div class="card-body' + (c.their_ask ? '' : ' muted') + '">' + escHtml(c.their_ask || '—') + '</div></div>' +
      '<div class="card"><div class="card-label">I want from them</div><div class="card-body' + (c.my_ask ? '' : ' muted') + '">' + escHtml(c.my_ask || '—') + '</div></div></div>';
  }
  h += '</div><div>';
  h += (c.how_we_met || c.introduced_by ? '<div class="card"><div class="card-label">How we met</div><div class="card-body">' + escHtml(c.how_we_met || '') + (c.introduced_by ? (c.how_we_met ? '\n' : '') + 'Introduced by ' + escHtml(c.introduced_by) : '') + '</div></div>' : '');
  h += card('Personal', c.personal_notes);
  h += card('Notes', c.notes);
  if (c.email || c.phone || c.other_link) h += '<div class="card"><div class="card-label">Contact</div><div class="card-body" style="font-size:14px;">' +
    [c.email, c.phone, c.other_link].filter(Boolean).map(escHtml).join('\n') + '</div></div>';
  h += '</div></div>';

  var items = c.interactions || [];
  h += '<div class="sec"><div class="sec-head"><div class="sec-title">Conversations <b>' + items.length + '</b></div><a class="sec-link" href="#log/' + attr(c.id) + '">+ Log one</a></div>';
  if (!items.length) h += '<div class="empty">No conversations logged yet.</div>';
  else h += '<div class="timeline">' + items.map(function(i){ return timelineItem(c, i); }).join('') + '</div>';
  h += '</div>';

  main.innerHTML = h;
}
function timelineItem(c, i){
  var blk = function(lbl, txt, cls){ return txt ? '<div class="tl-block ' + (cls || '') + '"><div class="lbl">' + lbl + '</div><div class="txt">' + escHtml(txt) + '</div></div>' : ''; };
  var h = '<div class="tl-item"><div class="card">' +
    '<div class="tl-date"><span>' + escHtml(fmtDate(i.happened_on)) + (i.channel ? ' · ' + escHtml(i.channel) : '') + (i.context ? ' · ' + escHtml(i.context) : '') + '</span>' +
      '<button class="edit" onclick="go(\'#i/' + attr(c.id) + '/' + attr(i.id) + '\')">Edit</button></div>' +
    blk('Summary', i.summary) +
    blk('Key takeaways', i.takeaways) +
    blk('Their call to action', i.their_cta) +
    blk('Problem I could solve', i.problem_spotted, 'prob');
  if (i.my_next_step){
    var n = daysFromToday(i.next_step_due);
    var when = i.next_step_due ? (n < 0 && !i.next_step_done ? 'overdue · ' : '') + relDate(i.next_step_due) + ' · ' + fmtDate(i.next_step_due) : 'no date';
    h += '<div class="tl-block step' + (i.next_step_done ? ' done' : '') + '">' +
      '<button class="chk' + (i.next_step_done ? ' done' : '') + '" onclick="toggleStep(\'' + attr(i.id) + '\', ' + (i.next_step_done ? 'false' : 'true') + ')">✓</button>' +
      '<div><div class="txt' + (i.next_step_done ? ' done' : '') + '">' + escHtml(i.my_next_step) + '</div><div class="when">' + escHtml(when) + '</div></div></div>';
  }
  return h + '</div></div>';
}
function toggleStep(id, done){
  call('crm_complete_step', { p_id: id, p_done: done }).then(function(){
    state.dash = null;
    loadContact(state.contact.id);
  }).catch(function(e){ toast(e.message, true); });
}

/* =================== CONTACT FORM =================== */
var SENIORITY = ['', 'Junior', 'Mid-level', 'Senior', 'Lead / Manager', 'Director / VP', 'C-level / Founder'];
var CADENCES = [[0,'None'],[14,'2 wks'],[30,'Monthly'],[90,'Quarterly'],[180,'6 mo'],[365,'Yearly']];
var STATUSES = ['open','exploring','solved','parked'];
function field(id, label, value, opts){
  opts = opts || {};
  var inner;
  if (opts.type === 'textarea') inner = '<textarea id="' + id + '" class="' + (opts.tall ? 'tall' : '') + '" placeholder="' + attr(opts.ph || '') + '">' + escHtml(value || '') + '</textarea>';
  else if (opts.type === 'select') inner = '<select id="' + id + '">' + opts.options.map(function(o){ return '<option value="' + attr(o) + '"' + (o === (value || '') ? ' selected' : '') + '>' + escHtml(o || '—') + '</option>'; }).join('') + '</select>';
  else inner = '<input id="' + id + '" type="' + (opts.type || 'text') + '" value="' + attr(value || '') + '" placeholder="' + attr(opts.ph || '') + '"' + (opts.extra || '') + '>';
  return '<div class="field' + (opts.flag ? ' flag' : '') + '"><label for="' + id + '">' + label + '</label>' + inner + (opts.hint ? '<div class="hint">' + opts.hint + '</div>' : '') + '</div>';
}
function seg(name, options, current, fmt){
  return '<div class="seg ' + name + '" data-seg="' + name + '" data-val="' + attr(current) + '">' + options.map(function(o){
    var val = Array.isArray(o) ? o[0] : o, lbl = Array.isArray(o) ? o[1] : (fmt ? fmt(o) : o);
    return '<button type="button" class="' + (String(val) === String(current) ? 'active' : '') + '" data-v="' + attr(val) + '" onclick="pickSeg(this)">' + escHtml(lbl) + '</button>';
  }).join('') + '</div>';
}
function pickSeg(btn){
  var wrap = btn.parentNode;
  Array.prototype.forEach.call(wrap.children, function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  wrap.setAttribute('data-val', btn.getAttribute('data-v'));
  if (wrap.getAttribute('data-seg') === 'due') { var di = document.getElementById('f-next_step_due'); if (di) di.value = btn.getAttribute('data-v'); }
  if (state.route.view === 'logForm') saveDraft();
}
function segVal(name){ var el = document.querySelector('[data-seg="' + name + '"]'); return el ? el.getAttribute('data-val') : ''; }

function openContactForm(id){
  var editing = !!id;
  var c = editing && state.contact && state.contact.id === id ? state.contact : null;
  var back = editing ? '#c/' + id : '#people';
  setTop(editing ? 'Edit person' : 'New person', null, backBtn(back, 'Cancel'), '');
  if (editing && !c){
    main.innerHTML = '<div class="empty" style="margin-top:20px;">Loading…</div>';
    call('crm_get_contact', { p_id: id }).then(function(cc){ state.contact = cc; if (state.route.view === 'contactForm') renderContactForm(cc); })
      .catch(function(e){ toast(e.message, true); });
    return;
  }
  renderContactForm(c || {});
}
function renderContactForm(c){
  var editing = !!c.id;
  main.innerHTML = '<div class="form">' +
    '<div class="form-sec">Who</div>' +
    field('f-full_name', 'Name *', c.full_name, { ph: 'Full name', extra: ' autocapitalize="words" enterkeyhint="next"' }) +
    '<div class="field-row">' + field('f-company', 'Company', c.company) + field('f-job_title', 'Job title', c.job_title) + '</div>' +
    field('f-work_area', 'Specific work area', c.work_area, { ph: 'e.g. Clinical risk modelling, Series A fundraising', hint: 'Their actual specialism — what they\'d be the person to ask about.' }) +
    '<div class="field-row">' + field('f-seniority', 'Seniority', c.seniority, { type: 'select', options: SENIORITY }) + field('f-industry', 'Industry', c.industry) + '</div>' +

    '<div class="form-sec">Reach them</div>' +
    '<div class="field-row">' + field('f-email', 'Email', c.email, { type: 'email', extra: ' inputmode="email" autocapitalize="off"' }) + field('f-phone', 'Phone', c.phone, { type: 'tel' }) + '</div>' +
    '<div class="field-row">' + field('f-linkedin', 'LinkedIn', c.linkedin, { ph: 'linkedin.com/in/…', extra: ' autocapitalize="off"' }) + field('f-other_link', 'Other link', c.other_link, { extra: ' autocapitalize="off"' }) + '</div>' +
    field('f-location', 'Location', c.location) +

    '<div class="form-sec">In my network</div>' +
    '<div class="field-row">' + field('f-how_we_met', 'How we met', c.how_we_met) + field('f-introduced_by', 'Introduced by', c.introduced_by) + '</div>' +
    field('f-tags', 'Tags', (c.tags || []).join(', '), { ph: 'fintech, mentor, hiring', hint: 'Comma-separated. Become filter chips on the People screen.' }) +
    '<div class="field"><label>Warmth</label>' + seg('warm', [[1,'1 · Cold'],[2,'2'],[3,'3'],[4,'4'],[5,'5 · Close']], c.warmth || 3) + '</div>' +
    '<div class="field"><label>Stay in touch every</label>' + seg('cadence', CADENCES, c.cadence_days || 0) + '<div class="hint">They\'ll show under “Going cold” once this long has passed since you last spoke.</div></div>' +

    '<div class="form-sec">The headline</div>' +
    field('f-key_problem', 'Biggest problem I might be able to solve', c.key_problem, { type: 'textarea', flag: true, ph: 'What are they stuck on that I, or someone I know, could help with?' }) +
    '<div class="field"><label>Status</label>' + seg('status', STATUSES, c.problem_status || 'open', function(s){ return s.charAt(0).toUpperCase() + s.slice(1); }) + '</div>' +
    '<div class="field-row">' + field('f-their_ask', 'What they want from me', c.their_ask, { type: 'textarea' }) + field('f-my_ask', 'What I want from them', c.my_ask, { type: 'textarea' }) + '</div>' +

    '<div class="form-sec">Notes</div>' +
    field('f-personal_notes', 'Personal', c.personal_notes, { type: 'textarea', ph: 'Family, interests, birthday — the things that make a follow-up human.' }) +
    field('f-notes', 'Anything else', c.notes, { type: 'textarea' }) +

    '<div class="form-actions"><button class="btn-primary" id="save-btn" onclick="saveContact()">' + (editing ? 'Save changes' : 'Add person') + '</button>' +
      '<button class="btn-ghost" onclick="go(\'' + (editing ? '#c/' + attr(c.id) : '#people') + '\')">Cancel</button></div>' +
    (editing ? '<div class="form-danger"><button class="btn-danger" onclick="deleteContact(\'' + attr(c.id) + '\')">Delete this person and all their conversations</button></div>' : '') +
  '</div>';
  if (!editing) document.getElementById('f-full_name').focus();
}
function saveContact(){
  var payload = {
    id: state.route.id || null,
    full_name: v('f-full_name'), company: v('f-company'), job_title: v('f-job_title'), work_area: v('f-work_area'),
    seniority: v('f-seniority'), industry: v('f-industry'),
    email: v('f-email'), phone: v('f-phone'), linkedin: v('f-linkedin'), other_link: v('f-other_link'), location: v('f-location'),
    how_we_met: v('f-how_we_met'), introduced_by: v('f-introduced_by'),
    tags: v('f-tags').split(',').map(function(t){ return t.trim().replace(/^#/, ''); }).filter(Boolean),
    warmth: +segVal('warm') || 3, cadence_days: +segVal('cadence') || 0,
    key_problem: v('f-key_problem'), problem_status: segVal('status') || 'open',
    their_ask: v('f-their_ask'), my_ask: v('f-my_ask'),
    personal_notes: v('f-personal_notes'), notes: v('f-notes')
  };
  if (!payload.full_name){ toast('A name is required', true); document.getElementById('f-full_name').focus(); return; }
  var btn = document.getElementById('save-btn'); btn.disabled = true;
  call('crm_save_contact', { payload: payload }).then(function(c){
    state.contact = c; state.dash = null; state.people = [];
    toast(payload.id ? 'Saved' : 'Added ' + c.full_name);
    go('#c/' + c.id);
  }).catch(function(e){ btn.disabled = false; toast(e.message, true); });
}
function deleteContact(id){
  var name = state.contact ? state.contact.full_name : 'this person';
  if (!confirm('Delete ' + name + ' and every conversation with them? This cannot be undone.')) return;
  call('crm_delete_contact', { p_id: id }).then(function(){
    state.contact = null; state.dash = null; state.people = [];
    toast('Deleted');
    go('#people');
  }).catch(function(e){ toast(e.message, true); });
}

/* =================== LOG A CONVERSATION =================== */
var CHANNELS = ['In person','Call','Video','Email','DM','Event'];
var DUE_QUICK = [['','None'],[1,'Tomorrow'],[3,'3 days'],[7,'1 week'],[14,'2 weeks'],[30,'1 month']];
var logCtx = { contact: null, newName: '', iid: null };

function openLogForm(cid, iid){
  logCtx = { contact: null, newName: '', iid: iid || null };
  var back = cid ? '#c/' + cid : '#today';
  setTop(iid ? 'Edit conversation' : 'Log a conversation', null, backBtn(back, 'Cancel'), '');
  main.innerHTML = '<div class="empty" style="margin-top:20px;">Loading…</div>';
  var needPeople = state.people.length ? Promise.resolve() : call('crm_list_contacts', { q: null, tag: null }).then(function(l){ state.people = l || []; });
  var needContact = cid ? call('crm_get_contact', { p_id: cid }).then(function(c){ state.contact = c; logCtx.contact = c; }) : Promise.resolve();
  Promise.all([needPeople, needContact]).then(function(){
    if (state.route.view !== 'logForm') return;
    var i = {};
    if (iid && logCtx.contact){
      (logCtx.contact.interactions || []).forEach(function(x){ if (x.id === iid) i = x; });
    } else {
      var d = loadDraft();
      if (d && !cid){ i = d; if (d._contact_id){ var found = state.people.filter(function(p){ return p.id === d._contact_id; })[0]; if (found) logCtx.contact = found; } if (d._newName) logCtx.newName = d._newName; }
      else if (d && cid && d._contact_id === cid) i = d;
    }
    renderLogForm(i, !!(i && i._draft));
  }).catch(function(e){ toast(e.message, true); });
}
function renderLogForm(i, fromDraft){
  var editing = !!logCtx.iid;
  var dueQuick = '';
  main.innerHTML = '<div class="form" id="log-form">' +
    (fromDraft ? '<div class="draft-note"><span>Restored an unsaved draft.</span><button onclick="clearDraft(); openLogForm(state.route.cid, null)">Discard</button></div>' : '') +
    '<div class="form-sec">Who</div>' +
    '<div class="field" id="who-field">' + renderPicker() + '</div>' +

    '<div class="form-sec">When &amp; how</div>' +
    '<div class="field-row">' + field('f-happened_on', 'Date', (i.happened_on || todayISO()).slice(0,10), { type: 'date' }) + field('f-context', 'Where / context', i.context, { ph: 'Coffee at Fora, RSA conf…' }) + '</div>' +
    '<div class="field"><label>Channel</label>' + seg('channel', CHANNELS, i.channel || 'In person') + '</div>' +

    '<div class="form-sec">What was said</div>' +
    field('f-takeaways', 'Key takeaways', i.takeaways, { type: 'textarea', tall: true, ph: 'The 2–3 things worth remembering.' }) +
    field('f-their_cta', 'Their biggest call to action', i.their_cta, { type: 'textarea', ph: 'What did they ask for, or want to happen next?' }) +
    field('f-problem_spotted', 'Biggest problem I might be able to solve', i.problem_spotted, { type: 'textarea', flag: true, ph: 'What are they stuck on? If it\'s their first, it becomes their headline problem.' }) +
    field('f-summary', 'Anything else', i.summary, { type: 'textarea' }) +

    '<div class="form-sec">My next step</div>' +
    field('f-my_next_step', 'What I\'ll do', i.my_next_step, { ph: 'Send the intro to Priya', extra: ' enterkeyhint="done"' }) +
    '<div class="field"><label>Due</label>' + seg('due', DUE_QUICK.map(function(o){ return [o[0] === '' ? '' : addDaysISO(o[0]), o[1]]; }), i.next_step_due ? i.next_step_due.slice(0,10) : '') +
      '<input type="date" id="f-next_step_due" value="' + attr(i.next_step_due ? i.next_step_due.slice(0,10) : '') + '" style="margin-top:8px;" onchange="syncDueSeg(this.value)"></div>' +

    '<div class="form-actions"><button class="btn-primary" id="save-btn" onclick="saveInteraction()">' + (editing ? 'Save changes' : 'Save conversation') + '</button>' +
      '<button class="btn-ghost" onclick="clearDraft(); go(\'' + attr(logCtx.contact ? '#c/' + logCtx.contact.id : '#today') + '\')">Cancel</button></div>' +
    (editing ? '<div class="form-danger"><button class="btn-danger" onclick="deleteInteraction(\'' + attr(logCtx.iid) + '\')">Delete this conversation</button></div>' : '') +
  '</div>';
  if (!editing) main.querySelector('#log-form').addEventListener('input', saveDraft);
  if (!logCtx.contact && !logCtx.newName){ var pi = document.getElementById('pick-input'); if (pi) pi.focus(); }
  else if (!editing && !i.takeaways) document.getElementById('f-takeaways').focus();
}
function syncDueSeg(val){
  var wrap = document.querySelector('[data-seg="due"]');
  if (!wrap) return;
  wrap.setAttribute('data-val', val);
  Array.prototype.forEach.call(wrap.children, function(b){ b.classList.toggle('active', b.getAttribute('data-v') === val); });
  saveDraft();
}
function renderPicker(){
  if (logCtx.contact){
    var c = logCtx.contact;
    return '<label>Person</label><div class="picked"><div><b>' + escHtml(c.full_name) + '</b><small>' + escHtml(roleLine(c) || c.work_area || '') + '</small></div>' +
      (logCtx.iid ? '' : '<button onclick="logCtx.contact=null; document.getElementById(\'who-field\').innerHTML=renderPicker(); document.getElementById(\'pick-input\').focus(); saveDraft();">Change</button>') + '</div>';
  }
  if (logCtx.newName){
    return '<label>Person</label><div class="picked"><div><b>' + escHtml(logCtx.newName) + '</b><small>New person — will be created</small></div>' +
      '<button onclick="logCtx.newName=\'\'; document.getElementById(\'who-field\').innerHTML=renderPicker(); document.getElementById(\'pick-input\').focus(); saveDraft();">Change</button></div>';
  }
  return '<label for="pick-input">Person</label><div class="picker"><input id="pick-input" type="text" placeholder="Type a name…" autocomplete="off" autocapitalize="words" oninput="pickerSearch(this.value)" onkeydown="pickerKey(event)"><div class="opts" id="pick-opts" hidden></div></div>';
}
function pickerSearch(q){
  var box = document.getElementById('pick-opts');
  q = q.trim();
  if (!q){ box.hidden = true; box.innerHTML = ''; return; }
  var ql = q.toLowerCase();
  var hits = state.people.filter(function(p){ return (p.full_name + ' ' + (p.company || '')).toLowerCase().indexOf(ql) !== -1; }).slice(0, 6);
  var exact = hits.some(function(p){ return p.full_name.toLowerCase() === ql; });
  box.innerHTML = hits.map(function(p){ return '<div class="opt" onclick="pickPerson(\'' + attr(p.id) + '\')">' + escHtml(p.full_name) + '<small>' + escHtml(roleLine(p) || p.work_area || '') + '</small></div>'; }).join('') +
    (exact ? '' : '<div class="opt new" onclick="pickNew(' + JSON.stringify(q).replace(/"/g, '&quot;') + ')">+ Add “' + escHtml(q) + '” as a new person</div>');
  box.hidden = false;
}
function pickerKey(e){
  if (e.key === 'Enter'){
    e.preventDefault();
    var first = document.querySelector('#pick-opts .opt');
    if (first) first.click();
  }
}
function pickPerson(id){
  logCtx.contact = state.people.filter(function(p){ return p.id === id; })[0];
  logCtx.newName = '';
  document.getElementById('who-field').innerHTML = renderPicker();
  document.getElementById('f-takeaways').focus();
  saveDraft();
}
function pickNew(name){
  logCtx.newName = name; logCtx.contact = null;
  document.getElementById('who-field').innerHTML = renderPicker();
  document.getElementById('f-takeaways').focus();
  saveDraft();
}
function readLogForm(){
  return {
    id: logCtx.iid || null,
    contact_id: logCtx.contact ? logCtx.contact.id : null,
    happened_on: v('f-happened_on') || todayISO(),
    context: v('f-context'), channel: segVal('channel'),
    takeaways: v('f-takeaways'), their_cta: v('f-their_cta'), problem_spotted: v('f-problem_spotted'), summary: v('f-summary'),
    my_next_step: v('f-my_next_step'), next_step_due: v('f-next_step_due') || null
  };
}
function saveDraft(){
  if (logCtx.iid || !document.getElementById('log-form')) return;
  var d = readLogForm();
  d._draft = true; d._contact_id = d.contact_id; d._newName = logCtx.newName;
  var empty = !d.takeaways && !d.their_cta && !d.problem_spotted && !d.summary && !d.my_next_step && !d.contact_id && !d._newName;
  if (empty) localStorage.removeItem(DRAFT_KEY); else localStorage.setItem(DRAFT_KEY, JSON.stringify(d));
}
function loadDraft(){ try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch(e){ return null; } }
function clearDraft(){ localStorage.removeItem(DRAFT_KEY); }

function saveInteraction(){
  var p = readLogForm();
  if (!p.contact_id && !logCtx.newName){ toast('Pick a person first', true); var pi = document.getElementById('pick-input'); if (pi) pi.focus(); return; }
  if (!p.takeaways && !p.summary && !p.their_cta && !p.problem_spotted && !p.my_next_step){ toast('Write at least one thing down', true); document.getElementById('f-takeaways').focus(); return; }
  var btn = document.getElementById('save-btn'); btn.disabled = true;
  var ensureContact = p.contact_id ? Promise.resolve(p.contact_id)
    : call('crm_save_contact', { payload: { full_name: logCtx.newName } }).then(function(c){ state.people = []; return c.id; });
  ensureContact.then(function(cid){
    p.contact_id = cid;
    return call('crm_save_interaction', { payload: p });
  }).then(function(c){
    state.contact = c; state.dash = null; state.people = [];
    clearDraft();
    toast(logCtx.iid ? 'Saved' : 'Logged ✓');
    go('#c/' + c.id);
  }).catch(function(e){ btn.disabled = false; toast(e.message, true); });
}
function deleteInteraction(id){
  if (!confirm('Delete this conversation?')) return;
  call('crm_delete_interaction', { p_id: id }).then(function(){
    state.dash = null;
    toast('Deleted');
    go('#c/' + logCtx.contact.id);
  }).catch(function(e){ toast(e.message, true); });
}

/* =================== boot =================== */
if ('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    /* scope 'crm' = only crm.html is controlled; the survey pages are never touched */
    navigator.serviceWorker.register('crm-sw.js', { scope: 'crm' }).catch(function(){});
  });
}
route();
</script>
