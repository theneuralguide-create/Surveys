<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decision-Making Under Uncertainty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f6f9fe;
    --panel: #ffffff;
    --panel-border: #e4eaf3;
    --panel-border-lit: #cfdbec;
    --blue: #2563eb;
    --blue-bright: #3b82f6;
    --blue-deep: #1d4ed8;
    --blue-soft: rgba(37,99,235,0.08);
    --blue-softer: rgba(37,99,235,0.04);
    --text: #16202e;
    --text-muted: #5c6879;
    --text-faint: #97a2b3;
    --font-display: 'Barlow Condensed', system-ui, sans-serif;
    --font-body: 'IBM Plex Sans', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      linear-gradient(135deg, rgba(37,99,235,0.07), transparent 34%),
      linear-gradient(300deg, rgba(59,130,246,0.06), transparent 40%),
      radial-gradient(1000px 500px at 90% -5%, rgba(37,99,235,0.05), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    display:flex; align-items:flex-start; justify-content:center;
    padding: 24px 16px 60px; line-height: 1.5;
  }
  #root{ width:100%; max-width: min(640px, 94vw); transition: max-width 180ms ease; }
  #root.q-screen{ padding-top: 12vh; }            /* shift question boxes ~12% lower */
  #root.landing-mode{ max-width: min(990px, 94vw); }
  #root.results-mode{ max-width: min(760px, 94vw); padding-top: 4vh; }
  #root.admin-mode{ max-width: 1100px; }
  @media (min-width: 1100px){
    #root{ max-width: 720px; }
    #root.q-screen{ padding-top: 11vh; }
  }

  /* vertically-centered screens (landing, section breaks, thanks) */
  .center-wrap{ min-height: calc(100vh - 90px); display:flex; flex-direction:column; align-items:stretch; justify-content:center; }
  .center-wrap.up{ padding-bottom: 20vh; }        /* biases centered content ~10% higher */
  .center-wrap.up-more{ padding-bottom: 14vh; }   /* biases centered content ~7% higher */

  .eyebrow{ font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--blue); margin-bottom: 10px; }
  .section-label{ margin-bottom: 16px; }
  .section-label .sec-num{ display:block; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 3px; }
  .section-label .sec-title{ font-family: var(--font-display); font-weight: 700; font-size: clamp(22px, 2.6vw, 28px); color: var(--blue); line-height: 1.1; }
  .panel{ background: var(--panel); border: 1px solid var(--panel-border); border-radius: 14px; padding: 30px 28px; box-shadow: 0 1px 2px rgba(20,40,80,0.04), 0 18px 40px rgba(37,99,235,0.07); position: relative; animation: fadeIn 170ms ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(5px);} to{opacity:1; transform:translateY(0);} }
  h1{ font-family: var(--font-display); font-weight: 700; font-size: clamp(28px, 7vw, 44px); line-height: 1.06; }
  h2{ font-family: var(--font-display); font-weight: 600; font-size: clamp(22px, 3vw, 32px); line-height: 1.2; }
  p.lead{ color: var(--text-muted); font-size: clamp(15px, 1.5vw, 18px); margin-top: 12px; }
  .prompt{ font-size: clamp(16px, 1.55vw, 19px); line-height: 1.6; margin: 16px 0 20px; color: var(--text); }
  .prompt b{ color: var(--blue-deep); font-weight: 600; }
  .prompt ul{ margin: 10px 0 10px 20px; }
  .prompt li{ margin-bottom: 4px; }
  .back-link{ position:absolute; top:16px; right:20px; background:none; border:none; color:var(--text-faint); font-family:var(--font-mono); font-size:11px; letter-spacing:0.04em; cursor:pointer; }
  .back-link:hover{ color: var(--text-muted); }

  .progress-bar-track{ height:6px; background:#e9eef7; border-radius:3px; margin-bottom: 8px; overflow:hidden; }
  .progress-bar-fill{ height:100%; background:linear-gradient(90deg, var(--blue), var(--blue-bright)); transition:width 300ms ease; }
  .progress-pct{ font-family:var(--font-mono); font-size:11px; color:var(--text-faint); margin-bottom:14px; display:block; }

  /* ===== Landing hero ===== */
  .hero{ text-align:center; padding: 10px 4px; }
  .hero-eyebrow{ font-family:var(--font-mono); font-size:clamp(16px,2.2vw,24px); letter-spacing:0.18em; text-transform:uppercase; color:var(--blue); margin-bottom:24px; }
  .hero h1{ font-size: clamp(51px, 11vw, 101px); letter-spacing:-0.015em; }
  .hero .lead{ max-width:640px; font-size:clamp(17px,2vw,24px); margin-left:auto; margin-right:auto; }
  .hero-stage{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 44px 0 12px; }
  .press-btn{ width: 275px; height: 275px; border-radius: 50%; background: radial-gradient(circle at 35% 28%, var(--blue-bright), var(--blue) 62%, var(--blue-deep) 100%); border: 9px solid #dbe7fb; box-shadow: 0 0 0 5px rgba(37,99,235,0.12), 0 22px 50px rgba(37,99,235,0.32), inset 0 -10px 20px rgba(0,0,0,0.18), inset 0 10px 18px rgba(255,255,255,0.25); color: #ffffff; font-family: var(--font-display); font-weight: 700; font-size: 33px; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; transition: transform 110ms ease, box-shadow 110ms ease; }
  .press-btn:hover{ transform: translateY(-2px); box-shadow: 0 0 0 4px rgba(37,99,235,0.16), 0 22px 46px rgba(37,99,235,0.38), inset 0 -8px 16px rgba(0,0,0,0.18), inset 0 8px 14px rgba(255,255,255,0.25); }
  .press-btn:active{ transform: scale(0.95) translateY(2px); }
  .fine-print{ font-size: 12px; color: var(--text-faint); margin-top: 22px; text-align:center; }
  .ver-label{ font-family:var(--font-mono); font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-faint); margin-top:26px; }
  .ver-toggle{ display:inline-flex; gap:4px; margin-top:8px; padding:4px; background:#eef2f9; border:1px solid var(--panel-border); border-radius:999px; }
  .ver-toggle button{ border:none; background:none; font-family:var(--font-mono); font-size:12.5px; padding:7px 15px; border-radius:999px; color:var(--text-muted); cursor:pointer; transition:all 110ms ease; }
  .ver-toggle button:hover{ color:var(--blue-deep); }
  .ver-toggle button.active{ background:#fff; color:var(--blue-deep); box-shadow:0 1px 3px rgba(20,40,80,0.14); font-weight:600; }

  .section-break{ text-align:center; }
  .section-num{ font-family:var(--font-mono); font-size:12px; letter-spacing:0.18em; color:var(--text-faint); }
  .section-title{ font-family:var(--font-display); font-weight:700; font-size:clamp(34px, 9vw, 50px); margin:10px 0 6px; color:var(--blue); line-height:1.05; }
  .section-dots{ display:flex; gap:6px; justify-content:center; margin:18px 0 4px; }
  .section-dot{ width:26px; height:4px; border-radius:2px; background:#dbe3f0; }
  .section-dot.done{ background:var(--blue); }

  .choice-col{ display:flex; flex-direction:column; gap:8px; margin:16px 0; }
  .choice-btn{ text-align:left; background:#fbfcfe; border:1px solid var(--panel-border-lit); border-radius:9px; color:var(--text); font-family:var(--font-body); font-size:15px; padding:14px 16px; cursor:pointer; transition:background 110ms ease, border-color 110ms ease, color 110ms ease; }
  .choice-btn:hover{ border-color:var(--blue); background:var(--blue-softer); }
  .choice-btn.active{ background:var(--blue-soft); border-color:var(--blue); color:var(--blue-deep); font-weight:600; }

  /* political scale as a compact selectable ramp */
  .pol-col{ display:flex; flex-direction:column; gap:6px; margin:18px 0 4px; }
  .pol-btn{ position:relative; text-align:left; background:#fbfcfe; border:1px solid var(--panel-border-lit); border-radius:9px; color:var(--text); font-family:var(--font-body); font-size:15px; padding:12px 14px 12px 44px; cursor:pointer; transition:background 110ms ease, border-color 110ms ease; }
  .pol-btn .dot{ position:absolute; left:16px; top:50%; transform:translateY(-50%); width:14px; height:14px; border-radius:50%; border:2px solid var(--panel-border-lit); background:#fff; }
  .pol-btn:hover{ border-color:var(--blue); background:var(--blue-softer); }
  .pol-btn.active{ background:var(--blue-soft); border-color:var(--blue); color:var(--blue-deep); font-weight:600; }
  .pol-btn.active .dot{ border-color:var(--blue); background:var(--blue); box-shadow:0 0 0 3px rgba(37,99,235,0.18); }
  .pol-note{ font-size:13px; color:var(--text-muted); margin-top:14px; }

  .text-input{ width:100%; background:#fbfcfe; border:1px solid var(--panel-border-lit); border-radius:8px; color:var(--text); font-family:var(--font-body); font-size:15px; padding:12px 14px; }
  .text-input:focus{ outline:none; border-color:var(--blue); background:#fff; }

  .dropdown-wrap{ position:relative; margin: 16px 0 22px; }
  .dropdown-list{ position:absolute; top:calc(100% + 4px); left:0; right:0; max-height:220px; overflow-y:auto; background:var(--panel); border:1px solid var(--panel-border-lit); border-radius:9px; box-shadow:0 12px 28px rgba(20,40,80,0.14); z-index:20; display:none; }
  .dropdown-list.open{ display:block; }
  .dropdown-item{ padding:10px 14px; font-size:14.5px; color:var(--text-muted); cursor:pointer; }
  .dropdown-item:hover{ background: var(--blue-soft); color:var(--text); }

  .slider-wrap{ position:relative; padding-top:34px; margin-top: 10px; }
  .slider-bubble{ position:absolute; top:0; transform:translateX(-50%); background:var(--blue); color:#fff; font-family:var(--font-mono); font-size:12px; font-weight:600; padding:3px 8px; border-radius:5px; white-space:nowrap; }
  .slider-bubble::after{ content:''; position:absolute; left:50%; top:100%; transform:translateX(-50%); border:4px solid transparent; border-top-color:var(--blue); }
  input[type=range]{ -webkit-appearance:none; width:100%; height:5px; border-radius:3px; background: #dbe3f0; outline:none; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:22px; height:22px; border-radius:50%; background: radial-gradient(circle at 35% 30%, #cfe0ff, var(--blue) 70%); border: 3px solid #fff; cursor:pointer; box-shadow: 0 2px 7px rgba(37,99,235,0.4); }
  input[type=range]::-moz-range-thumb{ width:18px; height:18px; border-radius:50%; background: radial-gradient(circle at 35% 30%, #cfe0ff, var(--blue) 70%); border: 3px solid #fff; cursor:pointer; }
  .range-labels{ display:flex; justify-content:space-between; font-size:11px; color: var(--text-faint); margin-top:8px; font-family: var(--font-mono); }

  /* big centred slider read-outs */
  .slider-big{ text-align:center; margin:10px 0 18px; }
  .slider-big .bignum{ font-family:var(--font-display); font-weight:700; font-size:clamp(48px,10vw,76px); color:var(--blue); line-height:1; }
  .slider-big .bigsuffix{ display:block; font-size:15px; color:var(--text-muted); margin-top:6px; }
  .slider-duo{ text-align:center; margin:10px 0 18px; display:flex; flex-direction:column; gap:14px; }
  .duo-line .bignum{ font-family:var(--font-display); font-weight:700; font-size:clamp(36px,7vw,56px); line-height:1; }
  .duo-line.ok .bignum{ color:var(--blue); }
  .duo-line.bad .bignum{ color:#b64545; }
  .duo-line .duo-lbl{ display:block; font-size:14px; color:var(--text-muted); margin-top:3px; }

  /* one-at-a-time importance ratings (1-10) */
  .rate-intro{ font-family:var(--font-body); font-size:15px; font-weight:600; letter-spacing:0.01em; color:var(--blue-deep); margin-bottom:10px; }
  .rate-legend{ display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:11px; color:var(--text-faint); margin:18px 0 8px; }
  .rate-grid{ display:grid; grid-template-columns:repeat(10,1fr); gap:6px; }
  .rate-btn{ aspect-ratio:1; min-width:0; border-radius:8px; background:#fbfcfe; border:1px solid var(--panel-border-lit); color:var(--text-muted); font-family:var(--font-mono); font-size:15px; cursor:pointer; transition:all 90ms ease; }
  .rate-btn:hover{ border-color:var(--blue); }
  .rate-btn.active{ background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600; }
  @media (max-width:560px){ .rate-grid{ grid-template-columns:repeat(5,1fr); } }

  /* results: icon + share */
  .result-icon{ font-size:56px; line-height:1; margin-bottom:10px; }
  .share-row{ display:flex; justify-content:center; gap:10px; margin-top:14px; }
  .share-url{ text-align:center; font-family:var(--font-mono); font-size:13px; color:var(--blue-deep); background:var(--blue-soft); border:1px dashed var(--blue); border-radius:8px; padding:10px 12px; margin-top:14px; letter-spacing:0.02em; }

  /* quick-fire (all on one page: statements left, scale right) */
  .qf-intro{ font-size:clamp(14px,1.4vw,16px); color:var(--text-muted); margin:6px 0 12px; }
  .qf-head{ display:grid; grid-template-columns: 1fr 300px; gap:18px; align-items:end; }
  .qf-head-legend{ display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:11px; color:var(--text-faint); padding:0 2px 6px; }
  .qf-head-legend span{ text-align:left; line-height:1.25; }
  .qf-row{ display:grid; grid-template-columns: 1fr 300px; gap:18px; align-items:center; padding:13px 0; border-bottom:1px solid var(--panel-border); }
  .qf-row:last-of-type{ border-bottom:none; }
  .qf-statement{ font-weight:500; font-size:clamp(15px,1.45vw,17px); line-height:1.35; }
  .scale-legend{ display:flex; justify-content:space-between; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-faint); margin-bottom: 8px; padding: 0 2px; }
  .scale-row{ display:flex; gap:6px; }
  .scale-btn{ flex:1; aspect-ratio: 1; min-width:0; border-radius: 8px; background: #fbfcfe; border: 1px solid var(--panel-border-lit); color: var(--text-faint); font-family: var(--font-mono); font-size: clamp(13px,1.3vw,16px); cursor:pointer; transition: all 90ms ease; }
  .scale-btn:hover{ border-color: var(--blue); }
  .scale-btn.active{ background: var(--blue); border-color: var(--blue); color: #fff; font-weight:600; }
  @media (max-width: 560px){
    .qf-head{ grid-template-columns: 1fr; }
    .qf-row{ grid-template-columns: 1fr; gap:9px; padding:15px 0; }
  }

  .btn-row{ display:flex; gap:10px; margin-top: 8px; }
  .btn-primary{ flex:1; background: var(--blue); color:#fff; border:none; border-radius:9px; font-family: var(--font-body); font-weight:600; font-size:15px; padding: 14px 18px; cursor:pointer; transition: background 120ms ease, filter 120ms ease; }
  .btn-primary:hover{ filter: brightness(1.06); }
  .btn-primary:disabled{ background: #dbe3f0; color: var(--text-faint); cursor:not-allowed; filter:none; }
  .btn-ghost{ background:none; border:1px solid var(--panel-border-lit); color: var(--text-muted); border-radius:9px; font-family: var(--font-body); font-size:14px; padding: 12px 16px; cursor:pointer; }
  .btn-ghost:hover{ border-color: var(--text-muted); color: var(--text); }

  /* ===== results / comparison ===== */
  .result-hero{ text-align:center; padding: 6px 4px 10px; }
  .result-eyebrow{ font-family:var(--font-mono); font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--text-faint); }
  .result-title{ font-family:var(--font-display); font-weight:700; font-size:clamp(34px,8.5vw,52px); color:var(--blue); line-height:1.04; margin:8px 0 8px; }
  .result-desc{ color:var(--text-muted); font-size:15.5px; max-width:460px; margin:0 auto; }
  .result-sub{ font-family:var(--font-mono); font-size:11px; color:var(--text-faint); margin-top:16px; }
  .cmp{ margin:22px 0 4px; }
  .cmp-head{ display:flex; justify-content:space-between; align-items:baseline; }
  .cmp-label{ font-weight:600; font-size:14.5px; }
  .cmp-you{ font-family:var(--font-mono); font-size:12px; color:var(--blue); font-weight:600; }
  .cmp-track{ position:relative; height:14px; background:#eef2f9; border-radius:7px; margin:9px 0 8px; }
  .cmp-fill{ height:100%; background:linear-gradient(90deg, var(--blue), var(--blue-bright)); border-radius:7px; transition:width 600ms cubic-bezier(.22,.61,.36,1); }
  .cmp-avg{ position:absolute; top:-5px; width:2px; height:24px; background:#9aa6b8; border-radius:1px; }
  .cmp-avg-lbl{ position:absolute; top:-19px; transform:translateX(-50%); font-family:var(--font-mono); font-size:9px; color:#9aa6b8; white-space:nowrap; }
  .cmp-note{ font-size:12.5px; color:var(--text-muted); }
  .result-divider{ height:1px; background:var(--panel-border); margin:22px 0; }

  .admin-wrap{ max-width:1100px; }
  table.data-table{ border-collapse:collapse; width:100%; font-size:12px; font-family:var(--font-mono); }
  table.data-table th, table.data-table td{ border:1px solid var(--panel-border); padding:6px 8px; text-align:left; white-space:nowrap; }
  table.data-table th{ background:#f2f6fd; color:var(--blue-deep); position:sticky; top:0; }
  .table-scroll{ overflow:auto; max-height:56vh; border:1px solid var(--panel-border); border-radius:10px; margin-top: 14px; }
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin:18px 0; }
  .stat-box{ background:#f7faff; border:1px solid var(--panel-border); border-radius:10px; padding:14px; }
  .stat-box .num{ font-family:var(--font-display); font-size:26px; color:var(--blue); }
  .stat-box .lbl{ font-size:11.5px; color:var(--text-muted); margin-top:4px; }

  .hub-back{ position:fixed; top:14px; left:18px; z-index:30; font-family:var(--font-mono); font-size:11px; letter-spacing:0.06em; color:var(--text-faint); text-decoration:none; }
  .hub-back:hover{ color:var(--blue); }

  @media (prefers-reduced-motion: reduce){ *{ animation: none !important; transition: none !important; } }
  @media (max-width: 420px){
    .panel{ padding: 24px 18px; }
    .press-btn{ width: 176px; height:176px; font-size:20px; }
  }

  /* ===== Short viewports (e.g. laptop/desktop screens with limited height) =====
     Phones are tall, so these max-height rules leave them untouched; they only
     kick in when vertical space is tight, letting the landing hero fit on screen
     instead of overflowing. */
  @media (max-height: 900px){
    .center-wrap{ min-height: calc(100vh - 48px); }
    .center-wrap.up-more{ padding-bottom: 6vh; }
    .hero{ padding: 4px; }
    .hero-eyebrow{ font-size: 17px; margin-bottom: 14px; }
    .hero h1{ font-size: clamp(38px, 7vw, 66px); }
    .hero .lead{ font-size: clamp(15px, 1.6vw, 18px); margin-top: 10px; }
    .hero-stage{ padding: 22px 0 6px; }
    .press-btn{ width: 208px; height: 208px; font-size: 26px; border-width: 8px; }
    .ver-label{ margin-top: 16px; }
    .ver-toggle{ margin-top: 6px; }
    .fine-print{ margin-top: 14px; }
  }
  @media (max-height: 740px){
    .center-wrap{ min-height: calc(100vh - 32px); }
    .center-wrap.up-more{ padding-bottom: 2vh; }
    .hero-eyebrow{ font-size: 14px; margin-bottom: 9px; }
    .hero h1{ font-size: clamp(32px, 6vw, 50px); }
    .hero .lead{ font-size: 14.5px; margin-top: 8px; }
    .hero-stage{ padding: 13px 0 4px; }
    .press-btn{ width: 160px; height: 160px; font-size: 21px; border-width: 7px; }
    .ver-label{ margin-top: 11px; }
    .ver-toggle{ margin-top: 5px; }
    .ver-toggle button{ padding: 5px 12px; font-size: 12px; }
    .fine-print{ margin-top: 10px; font-size: 11px; }
  }
  @media (max-height: 560px){
    .center-wrap{ min-height: calc(100vh - 24px); }
    .center-wrap.up-more{ padding-bottom: 0; }
    .hero-eyebrow{ font-size: 12px; margin-bottom: 6px; }
    .hero h1{ font-size: clamp(26px, 5vw, 40px); }
    .hero .lead{ font-size: 13.5px; margin-top: 6px; }
    .hero-stage{ padding: 9px 0 2px; }
    .press-btn{ width: 122px; height: 122px; font-size: 17px; border-width: 6px; }
    .ver-label{ margin-top: 8px; }
    .fine-print{ margin-top: 7px; }
  }
</style>
</head>
<body>
<a class="hub-back" href="../surveys.html">← All surveys</a>
<div id="root"></div>

<script src="../config.js"></script>
<script>
/* =================== DATA =================== */
var OPT_AGE = ['Under 18','18-24','25-34','35-44','45-54','55-64','65+'];
var OPT_GENDER = ['Man','Woman','Trans (man)','Trans (woman)','Non-binary','Prefer to self-describe','Prefer not to say'];
var OPT_EDU = ['Primary school','Secondary / High school','Vocational qualification / Apprenticeship',"Bachelor's degree","Master's degree",'Doctorate (PhD or equivalent)','Other','Prefer not to say'];
var OPT_REFERRAL = ['Social media','Friend or family','Online community/forum','News article','University','Email','Search engine','Other'];
var OPT_YESNO = ['Yes','No'];
var OPT_YESNOUNSURE = ['Yes','No','Unsure'];
var OPT_HORIZON = ['Less than 1 year','1-2 years','3-5 years','5-10 years','10-20 years','20-40 years','More than 40 years','I would never press it'];

/* rated one at a time on a 1-10 importance scale (no "unsure") */

function escJs(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

/* =================== STORAGE =================== */
/* Persistence layer: use a host-provided window.storage if present; otherwise
   fall back to the browser's localStorage (works when the file is opened
   directly); finally fall back to a volatile in-memory store. The method
   signatures mirror the host API, and extra boolean args are ignored by the
   fallbacks. NOTE: localStorage is per-device/per-browser. Cross-device
   collection is handled by the hub backend below (see ../config.js); local
   storage remains as the draft store and offline fallback. */
var Store = (function(){
  if (typeof window !== 'undefined' && window.storage) return window.storage;
  var mem = {};
  var ls = null;
  try {
    if (typeof window !== 'undefined' && window.localStorage){
      window.localStorage.setItem('__probe__','1');
      window.localStorage.removeItem('__probe__');
      ls = window.localStorage;
    }
  } catch(e){ ls = null; }
  return {
    get: function(k){ var v = ls ? ls.getItem(k) : (k in mem ? mem[k] : null); return Promise.resolve({ value: v }); },
    set: function(k, v){ try { if (ls) ls.setItem(k, v); else mem[k] = v; } catch(e){ mem[k] = v; } return Promise.resolve(true); },
    delete: function(k){ if (ls) ls.removeItem(k); else delete mem[k]; return Promise.resolve(true); },
    list: function(prefix){
      var keys = [];
      if (ls){ for (var i=0;i<ls.length;i++){ var kk = ls.key(i); if (kk && kk.indexOf(prefix) === 0) keys.push(kk); } }
      else { Object.keys(mem).forEach(function(kk){ if (kk.indexOf(prefix) === 0) keys.push(kk); }); }
      return Promise.resolve({ keys: keys });
    }
  };
})();

/* ===== Hub backend (Supabase via ../config.js) =====
   When the hub is configured, completed responses are POSTed to the shared
   `responses` table (tagged with this survey's slug), and comparisons/admin
   read the pooled data back. When it isn't, everything falls back to the
   local Store above. */
var SURVEY_SLUG = 'decision-making';
var HUB = (function(){
  try {
    var c = window.SURVEY_HUB_CONFIG;
    if (c && c.url && c.anonKey &&
        String(c.url).indexOf('http') === 0 &&
        String(c.url).indexOf('YOUR-') === -1 &&
        String(c.anonKey).indexOf('YOUR-') === -1) return c;
  } catch(e){}
  return null;
})();
function hubHeaders(){
  return { 'apikey': HUB.anonKey, 'Authorization': 'Bearer ' + HUB.anonKey, 'Content-Type': 'application/json' };
}
function hubSubmit(record){
  if (!HUB) return Promise.resolve(false);
  return fetch(HUB.url + '/rest/v1/responses', {
    method: 'POST',
    headers: hubHeaders(),
    body: JSON.stringify({ survey_slug: SURVEY_SLUG, variant: record._variant || 'base', answers: record })
  }).then(function(r){ return r.ok; }).catch(function(){ return false; });
}
function hubLoadResponses(){
  if (!HUB) return Promise.resolve(null);
  return fetch(HUB.url + '/rest/v1/responses?survey_slug=eq.' + SURVEY_SLUG + '&select=variant,answers,submitted_at&order=submitted_at.asc', { headers: hubHeaders() })
    .then(function(r){ if (!r.ok) throw new Error('bad response'); return r.json(); })
    .then(function(rows){
      return rows.map(function(row){
        var rec = (row.answers && typeof row.answers === 'object') ? row.answers : {};
        if (!rec._variant) rec._variant = row.variant;
        if (!rec._submittedAt) rec._submittedAt = row.submitted_at;
        return rec;
      });
    })
    .catch(function(){ return null; });
}

async function resolveVariant(){
  if (FORCED_VARIANT === 'ai' || FORCED_VARIANT === 'base'){ state.variant = FORCED_VARIANT; return; }
  try { var r = await Store.get('assigned-variant', false); if (r && (r.value === 'ai' || r.value === 'base')){ state.variant = r.value; return; } } catch(e){}
  state.variant = Math.random() < 0.5 ? 'ai' : 'base';
  try { await Store.set('assigned-variant', state.variant, false); } catch(e){}
}
async function resolveTier(){
  if (TIERS[FORCED_TIER]){ state.tier = FORCED_TIER; return; }
  try { var r = await Store.get('assigned-tier', false); var tv = r && Number(r.value); if (TIERS[tv]){ state.tier = tv; return; } } catch(e){}
  var opts = [10, 1];
  state.tier = opts[Math.floor(Math.random() * 2)];
  try { await Store.set('assigned-tier', String(state.tier), false); } catch(e){}
}

function effectiveFlow(){
  return FLOW_IDS.filter(function(id){

function goNext(){
  var flow = effectiveFlow();
  if (state.idx < flow.length - 1){ state.idx++; showCurrentScreen(); }

function qSingle(title, bodyHtml, options, opts){
  opts = opts || {};
  var id = currentId();
  var current = getAnswer(id);
  var otherVal = getAnswer(id + '__other') || '';
  var showOther = opts.otherTrigger && current === opts.otherTrigger;
  var trig = opts.otherTrigger ? ("'" + escJs(opts.otherTrigger) + "'") : 'null';
  var optsHtml = options.map(function(o){
    var active = current === o ? ' active' : '';
    return '<button class="choice-btn' + active + '" data-val="' + escAttr(o) + '" onclick="selectOption(\'' + escJs(o) + '\', ' + trig + ')">' + o + '</button>';
  }).join('');
  var otherHtml = showOther
    ? '<input type="text" class="text-input" style="margin-top:10px;" placeholder="' + escAttr(opts.otherLabel || 'Please specify') + '" value="' + escAttr(otherVal) + '" oninput="setOther(this.value)">'
    : '';
  var continueHtml = showOther
    ? '<div class="btn-row" style="margin-top:16px;"><button class="btn-primary" id="other-continue-btn" ' + (otherVal.trim() ? '' : 'disabled') + ' onclick="goNext()">Continue</button></div>'
    : '';
  return screenShell(
    '<h2>' + title + '</h2>' +
    (bodyHtml ? '<div class="prompt">' + bodyHtml + '</div>' : '') +
    '<div class="choice-col">' + optsHtml + '</div>' + otherHtml + continueHtml
  );
}
function selectOption(value, otherTrigger){
  if (state.transitioning) return;
  var id = currentId();
  setAnswer(id, value);
  if (otherTrigger && value === otherTrigger){
    renderCurrent();
    var inp = document.querySelector('#q-panel input[type=text]');
    if (inp) inp.focus();
    return;
  }
  var btns = document.querySelectorAll('#q-panel .choice-btn');
  for (var i=0;i<btns.length;i++){ btns[i].classList.toggle('active', btns[i].getAttribute('data-val') === value); }
  state.transitioning = true;
  setTimeout(goNext, 165);
}
function setOther(v){
  state.answers[currentId() + '__other'] = v;
  saveDraft();
  var btn = document.getElementById('other-continue-btn');
  if (btn) btn.disabled = !v.trim();
}

function canProceed(id){

  if (RATE_STATEMENTS[id]) return getAnswer(id) !== undefined;

  if (state.screen !== 'survey') return;

  if (e.key === 'Enter'){

    if (/^[1-9]$/.test(e.key)) selectRate(parseInt(e.key, 10));

});

/* Visitors land straight on question 1. Variant (AI / non-AI) and the
   probability tier are assigned randomly on first visit and remembered, so
   nobody can peek at the other version; a part-finished draft resumes
   silently where it left off. Admins can force things with URL hashes:
   #ai / #base for the variant, #p10 / #p1 for the tier, #admin for data. */
async function beginSurvey(){
  state.screen = 'survey';
  root.className = 'q-screen';
  root.innerHTML = '<div class="panel"><h2>Loading…</h2></div>';
  var draft = await checkDraft();
  var hasDraft = !!(draft && draft.answers && Object.keys(draft.answers).length > 0);
  if (FORCED_VARIANT === 'ai' || FORCED_VARIANT === 'base') state.variant = FORCED_VARIANT;
  else if (hasDraft && (draft.variant === 'ai' || draft.variant === 'base')) state.variant = draft.variant;
  else await resolveVariant();
  if (TIERS[FORCED_TIER]) state.tier = FORCED_TIER;
  else if (hasDraft && TIERS[draft.tier]) state.tier = draft.tier;
  else await resolveTier();
  if (hasDraft){
    state.answers = draft.answers;
    state.idx = Math.min(draft.idx || 0, effectiveFlow().length - 1);
  } else {
    state.answers = {}; state.idx = 0;
  }
  renderCurrent();
}

/* =================== SCORING / PROFILE =================== */
function numOf(r, k){ var v = r[k]; return (typeof v === 'number' && !isNaN(v)) ? v : null; }
function likOf(r, k){ var v = r[k]; return (typeof v === 'number' && !isNaN(v)) ? v : 4; }
function countPress(r){
  return (r.s2_press === 'Yes' ? 1 : 0) + (r.s3_system === 'Yes' ? 1 : 0);
}
function scoreRisk(r){
  var pressComp = countPress(r) / 2 * 100;
  var comps = [];
  if (numOf(r,'s2_prob') !== null) comps.push(Math.min(100, numOf(r,'s2_prob') / 30 * 100));
  if (numOf(r,'s3_prob') !== null) comps.push(Math.min(100, numOf(r,'s3_prob') / 10 * 100));
  var probComp = comps.length ? avg(comps) : 30;
  var bold = (likOf(r,'l1') + likOf(r,'l4')) / 2;                       // 1-7 higher = bolder
  var caution = (likOf(r,'l3') + likOf(r,'l7') + likOf(r,'l9') + likOf(r,'l10')) / 4;
  var boldComp = (((bold - 1) / 6 * 100) + (100 - ((caution - 1) / 6 * 100))) / 2;
  return Math.max(0, Math.min(100, Math.round(0.4 * pressComp + 0.3 * probComp + 0.3 * boldComp)));
}
function scoreDoom(r){
  var items = [likOf(r,'l3'), likOf(r,'l5'), likOf(r,'l7'), likOf(r,'l9'), likOf(r,'l10')];
  var base = (avg(items) - 1) / 6 * 100;
  var pressInv = (2 - countPress(r)) / 2 * 100;
  return Math.max(0, Math.min(100, Math.round(0.7 * base + 0.3 * pressInv)));
}
/* distinct 4th axis: how much weight given to the long term / future generations */
function scoreFuture(r){
  var futures = (likOf(r,'l8') * 0.7) + (likOf(r,'l5') * 0.3); // 1-7
  return Math.max(0, Math.min(100, Math.round((futures - 1) / 6 * 100)));
}
function pctRankBelow(arr, v){
  if (!arr.length) return 50;
  var c = 0;
  for (var i=0;i<arr.length;i++){ if (arr[i] <= v) c++; }
  return Math.round(c / arr.length * 100);
}

/* titles by (risk band) x (doom band) */
var TITLES = {
  low: {
    low:  {name:'The Grounded Moderate', icon:'🌱', desc:'You take life as it comes — neither chasing big risks nor bracing for catastrophe. A steady hand.'},
    mid:  {name:'The Careful Guardian', icon:'🛡️', desc:'You value stability and would rather protect what already works than gamble on what might.'},
    high: {name:'The Sentinel', icon:'🗼', desc:'You see the fragility in things. Given the choice, you’d safeguard the future rather than roll the dice.'}
  },
  mid: {
    low:  {name:'The Steady Optimist', icon:'☀️', desc:'You’re open to progress and broadly trust that things work out — without betting the house on it.'},
    mid:  {name:'The Pragmatist', icon:'⚖️', desc:'You weigh risk and reward case by case and rarely land at the extremes. Balance is your instinct.'},
    high: {name:'The Watchful Realist', icon:'🔭', desc:'You’ll act when it counts, but you never lose sight of what could go wrong.'}
  },
  high: {

    mid:  {name:'The Calculated Gambler', icon:'🎲', desc:'You embrace big bets — eyes wide open to the stakes, and willing to take them anyway.'},
    high: {name:'The Fatalist', icon:'🌋', desc:'You’d take the leap even staring into the abyss. High stakes don’t scare you off; if anything, they focus you.'}
  }
};
function bandOf(v){ return v < 40 ? 'low' : (v <= 66 ? 'mid' : 'high'); }
function titleFor(risk, doom){ return TITLES[bandOf(risk)][bandOf(doom)]; }

/* deterministic baseline so comparisons aren't empty for early respondents */
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function buildBaseline(){
  var rnd = mulberry32(20260704);
  var out = [];
  for (var i=0;i<160;i++){
    var r = {};
    r.s2_press = rnd() < 0.55 ? 'Yes' : 'No';
    r.s3_system = rnd() < 0.38 ? 'Yes' : (rnd() < 0.7 ? 'No' : 'Unsure');
    r.s2_prob = Math.round(Math.pow(rnd(),1.8) * 45 * 10) / 10;
    r.s3_prob = Math.round(Math.pow(rnd(),2.2) * 12 * 10) / 10;
    r.s1_political = 1 + Math.floor(rnd()*7);
    r._ptier = [10,1][Math.floor(rnd()*2)];
    r.s3_r1 = 1 + Math.floor(rnd()*10);
    r.s3_r2 = 1 + Math.floor(rnd()*10);
    r.s3_r3 = 1 + Math.floor(rnd()*10);
    r.s4_p1 = 1 + Math.floor(rnd()*10);
    r.s4_p2 = 1 + Math.floor(rnd()*10);
    r.s4_p3 = 1 + Math.floor(rnd()*10);
    for (var j=1;j<=10;j++){
      var caution = (j===3||j===5||j===7||j===9||j===10);
      var centre = caution ? 5 : (j===1||j===4 ? 4 : 4);
      var val = Math.round(centre + (rnd()-0.5) * 4);
      r['l'+j] = Math.max(1, Math.min(7, val));
    }
    out.push(r);
  }
  return out;
}
var BASELINE = buildBaseline();

/* =================== FINISH / RESULTS =================== */
async function finishSurvey(){
  state.screen = 'submitting';
  root.className = '';
  root.innerHTML = '<div class="center-wrap"><div class="panel"><h2>Scoring your answers…</h2></div></div>';

  var record = {};
  RECORD_IDS.forEach(function(id){ record[id] = state.answers[id]; });
  Object.keys(state.answers).forEach(function(k){
    if (k.indexOf('__other') !== -1) record[k] = state.answers[k];
  });
  record._variant = state.variant;
  record._ptier = state.tier;
  record._submittedAt = new Date().toISOString();
  record._slug = SURVEY_SLUG;

  /* send to the shared backend (if configured), and always keep a local copy */
  try { await hubSubmit(record); } catch(e){}
  var key = 'response-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
  try { await Store.set(key, JSON.stringify(record), true); } catch(e){}

  var real = await loadAllResponses();
  renderResults(record, real);

function metricBarHtml(label, userVal, avgVal, note){
  var u = Math.max(0, Math.min(100, userVal));
  var a = Math.max(0, Math.min(100, avgVal));
  return '<div class="cmp">' +
    '<div class="cmp-head"><span class="cmp-label">' + label + '</span><span class="cmp-you">You: ' + Math.round(userVal) + '</span></div>' +
    '<div class="cmp-track">' +
      '<div class="cmp-fill" style="width:' + u + '%"></div>' +
      '<div class="cmp-avg" style="left:' + a + '%"></div>' +
      '<div class="cmp-avg-lbl" style="left:' + a + '%">avg</div>' +
    '</div>' +
    '<div class="cmp-note">' + note + '</div>' +
  '</div>';
}

function renderResults(record, real){
  state.screen = 'results';
  var variant = record._variant || 'base';
  var realSame = (real || []).filter(function(r){ return (r._variant || 'base') === variant; });
  var pool = (realSame.length >= 20) ? realSame : realSame.concat(BASELINE);

  var riskArr = pool.map(scoreRisk);
  var doomArr = pool.map(scoreDoom);
  var pressArr = pool.map(countPress);
  var futureArr = pool.map(scoreFuture);

  var uRisk = scoreRisk(record);
  var uDoom = scoreDoom(record);
  var uPress = countPress(record);
  var uFuture = scoreFuture(record);

  var t = titleFor(uRisk, uDoom);

  var riskPct = pctRankBelow(riskArr, uRisk);
  var doomPct = pctRankBelow(doomArr, uDoom);
  var pressPct = pctRankBelow(pressArr, uPress);
  var futurePct = pctRankBelow(futureArr, uFuture);

  var riskNote = 'You’re more risk-tolerant than <b>' + riskPct + '%</b> of respondents.';
  var doomNote = 'You lean more cautious than <b>' + doomPct + '%</b> of respondents.';
  var pressWord = uPress === 2 ? 'both' : (uPress === 0 ? 'neither' : 'one');
  var pressNote = 'You’d press <b>' + pressWord + '</b> of the two buttons — more than <b>' + pressPct + '%</b> of people.';
  var futureNote = 'You weigh the long term and future generations more heavily than <b>' + futurePct + '%</b> of respondents.';

  var realCount = realSame.length;
  var armWord = variant === 'ai' ? 'this (AI) version' : 'this version';
  var subText = realCount > 0
    ? 'Compared with ' + realCount + (realCount === 1 ? ' person' : ' people') + ' who took ' + armWord
    : 'Compared against a reference sample while responses are still being gathered';

  var riskAvg = avg(riskArr), doomAvg = avg(doomArr), pressAvgPct = avg(pressArr) / 3 * 100, futureAvg = avg(futureArr);

  window._myTitle = t.name;
  window._myRiskPct = riskPct;

  root.className = 'results-mode';
  root.innerHTML =
    '<div class="panel">' +
      '<div class="result-hero">' +
        '<div class="result-icon">' + t.icon + '</div>' +
        '<div class="result-eyebrow">Your profile</div>' +
        '<div class="result-title">' + t.name + '</div>' +
        '<div class="result-desc">' + t.desc + '</div>' +
        '<div class="result-sub">' + subText + '</div>' +
      '</div>' +
      '<div class="result-divider"></div>' +
      '<div style="font-family:var(--font-display); font-weight:600; font-size:20px; margin-bottom:4px;">How you compare</div>' +
      metricBarHtml('Risk appetite', uRisk, riskAvg, riskNote) +
      metricBarHtml('Caution about catastrophe', uDoom, doomAvg, doomNote) +
      metricBarHtml('Willingness to act', uPress / 2 * 100, pressAvgPct, pressNote) +
      metricBarHtml('Regard for future generations', uFuture, futureAvg, futureNote) +
      '<div class="result-divider"></div>' +
      '<p class="lead" style="text-align:center; margin-top:0;">Thank you for taking part. Your response has been recorded.</p>' +
      '<div class="share-row"><button class="btn-primary" id="share-btn" style="flex:none;" onclick="shareResults()">Share your results</button></div>' +
      '<div class="share-url">Take the survey → tinyurl.com/letsquestionrisk</div>' +
    '</div>';
}

  var statsHtml = '<div class="stat-grid">' +
    statBox(n, 'Responses in view') +
    statBox(n ? Math.round(s2Yes/n*100) + '%' : '—', 'Would act (personal scenario)') +
    statBox(fmtPct(avg(s2ProbVals)), 'Avg. accepted risk — personal (5yr)') +
    statBox(fmtPct(avg(s3ProbVals)), 'Avg. accepted catastrophe risk') +
    statBox(n ? Math.round(avg(riskVals)) : '—', 'Avg. risk-appetite score') +
    statBox(n ? Math.round(avg(doomVals)) : '—', 'Avg. caution score') +
    statBox(avg(polVals) !== null ? avg(polVals).toFixed(1) + ' / 7' : '—', 'Avg. political lean') +
    statBox(tierCounts[10] + ' / ' + tierCounts[1], 'Tier split (10% / 1%)') +
  '</div>';

  var cols = ['_variant','_ptier'].concat(RECORD_IDS).concat(['_submittedAt']);
  var theadHtml = '<tr>' + cols.map(function(c){ return '<th>' + c + '</th>'; }).join('') + '</tr>';
  var rowsHtml = view.map(function(r){
    return '<tr>' + cols.map(function(c){
      var v = (c === '_variant') ? variantOf(r) : r[c];
      return '<td>' + (v === undefined || v === null ? '' : escAttr(String(v))) + '</td>';
    }).join('') + '</tr>';
  }).join('');

  root.innerHTML =
    '<div class="eyebrow">Admin · Response Dashboard</div>' +
    '<div class="panel">' +
      '<h1 style="font-size:28px;">Results</h1>' +
      '<p class="lead" style="margin-top:6px;">Non-AI and AI versions are shown separately so you can compare how framing changes answers. New visitors are split 50/50 automatically.</p>' +
      filterBar +
      statsHtml +
      '<div class="btn-row" style="margin-bottom:10px; flex-wrap:wrap;">' +
        '<button class="btn-primary" style="flex:none;" onclick="downloadCSV()">Download CSV (current view)</button>' +
        '<button class="btn-ghost" style="flex:none;" onclick="initAdmin()">Refresh</button>' +
        '<button class="btn-ghost" style="flex:none;" onclick="previewVariant(\'base\')">Preview Non-AI survey</button>' +
        '<button class="btn-ghost" style="flex:none;" onclick="previewVariant(\'ai\')">Preview AI survey</button>' +
      '</div>' +
      '<div class="table-scroll"><table class="data-table"><thead>' + theadHtml + '</thead><tbody>' + rowsHtml + '</tbody></table></div>' +
    '</div>';
}
function toCSV(rows){
  var cols = ['_variant','_ptier'].concat(RECORD_IDS).concat(['_submittedAt']);
  var lines = [cols.join(',')];
  rows.forEach(function(r){
    lines.push(cols.map(function(c){
      var raw = (c === '_variant') ? variantOf(r) : r[c];
      var v = raw === undefined || raw === null ? '' : String(raw);
      v = v.replace(/"/g, '""');
      if (/[",\n]/.test(v)) v = '"' + v + '"';
      return v;
    }).join(','));
  });
  return lines.join('\n');
}
function downloadCSV(){
  var filter = window._adminFilter || 'all';
  var csv = toCSV(adminFiltered(window._allResponses || []));
  var blob = new Blob([csv], {type:'text/csv'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'survey-responses-' + filter + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* =================== INIT =================== */
(function initApp(){
  var h = location.hash;
  if (h === '#admin'){ initAdmin(); return; }
  if (h === '#ai'){ FORCED_VARIANT = 'ai'; }
  else if (h === '#base' || h === '#nonai'){ FORCED_VARIANT = 'base'; }
  else if (h === '#p10'){ FORCED_TIER = 10; }
  else if (h === '#p1'){ FORCED_TIER = 1; }
  beginSurvey();
})();
</script>
